name: ci-python

# Este archivo se copia TAL CUAL a .github/workflows/ci-python.yml.
# Ojo: ${{ matrix.python-version }} es sintaxis de GitHub Actions, NO un marcador
# de plantilla; el pipeline nunca debe pasarlo por str.replace.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias declaradas (si existen)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
